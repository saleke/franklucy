<svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="prism-bg" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="prism-top-facet" x1="18" y1="4" x2="6" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="60%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="prism-right-facet" x1="18" y1="4" x2="30" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="60%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="prism-base-facet" x1="6" y1="20" x2="28" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <radialGradient id="prism-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle container background for high visibility on both light & dark browser tabs -->
  <rect width="36" height="36" rx="9" fill="url(#prism-bg)"/>
  <rect width="36" height="36" rx="9" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Ambient Glow -->
  <circle cx="18" cy="18" r="9" fill="url(#prism-core-glow)"/>

  <!-- Top-Left Facet -->
  <path d="M18 6L8 12V22L18 17V6Z" fill="url(#prism-top-facet)"/>
  <!-- Right Facet -->
  <path d="M18 6L28 12V22L18 29V17L28 12" fill="url(#prism-right-facet)"/>
  <!-- Bottom-Left Facet -->
  <path d="M8 22L18 29L18 17L8 12V22Z" fill="url(#prism-base-facet)"/>

  <!-- Specular Facet Ridges -->
  <path d="M18 6L18 29" stroke="rgba(255,255,255,0.5)" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M8 12L28 22" stroke="rgba(255,255,255,0.3)" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Central Brilliant Radiant Star -->
  <circle cx="18" cy="17" r="2.2" fill="#FFFFFF"/>
</svg>
